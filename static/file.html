<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CDN Directory</title>
    <style>
        body { font: 14px/1.5 monospace; background: #121212; color: #e0e0e0; margin: 0; padding: 20px; }
        nav { background: #1e1e1e; padding: 10px 20px; margin: -20px -20px 20px; border-bottom: 1px solid #333; }
        a { color: #8ab4f8; text-decoration: none; }
        ul { list-style: none; padding-left: 18px; margin: 0; }
        summary { cursor: pointer; color: #f1fa8c; font-weight: bold; margin: 4px 0; }
        li { margin: 4px 0; }
        span { color: #888; font-size: 0.85em; }
        button { background: #333; color: #ccc; border: 0; padding: 2px 6px; font: inherit; cursor: pointer; border-radius: 3px; }
    </style>
</head>
<body>

    <nav><a href="/">Home</a> | Files</nav>
    <div id="tree">Loading...</div>

    <script>
    const user = "FryrvoStudio", repo = "cdn";

    async function loadDir(path = "static") {
        const res = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/${path}`);
        if (!res.ok) return "Failed to load.";
        const items = await res.json();
        const ul = document.createElement("ul");

        for (const item of items) {
            if (item.name.startsWith(".") || item.name === "files.html") continue;
            const li = document.createElement("li");

            if (item.type === "dir") {
                const det = document.createElement("details");
                det.innerHTML = `<summary>📁 ${item.name}/</summary>`;
                det.ontoggle = async () => {
                    if (det.open && !det.dataset.loaded) {
                        det.dataset.loaded = true;
                        det.appendChild(await loadDir(item.path));
                    }
                };
                li.appendChild(det);
            } else {
                const rel = item.path.replace(/^static\//, '');
                const url = `https://cdn.fryrvo.com/${rel}`;
                li.innerHTML = `📄 <a href="/${rel}" target="_blank">${item.name}</a> <span>(${(item.size/1024).toFixed(1)} KB)</span> <button onclick="navigator.clipboard.writeText('${url}')">copy</button>`;
            }
            ul.appendChild(li);
        }
        return ul;
    }

    loadDir().then(ul => {
        const t = document.getElementById("tree");
        t.innerHTML = "";
        t.appendChild(ul);
    });
    </script>
</body>
</html>
